name: quality-gates

on:
  push:
    branches: [feature/audit, main]
  pull_request:

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECURITY_TEST_DB_HOST: 127.0.0.1
      SECURITY_TEST_DB_PORT: 3306
      HR_IMPORT_TEST_DB_HOST: 127.0.0.1
      HR_IMPORT_TEST_DB_PORT: 3306
      TEST_DB_USER_HOST: '%'
      DEPLOY_TEST_DB_HOST: 127.0.0.1
      DEPLOY_TEST_DB_PORT: 3306
      DEPLOY_TEST_DB_USER: root
      DEPLOY_TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        working-directory: server
        run: npm ci
      - name: Syntax and static audits
        run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          node scripts/miniprogram-compat-audit.js
          node scripts/org-lifecycle-audit.js --strict
          node scripts/security-audit.js --strict
          node scripts/tenant-sql-audit.js
          node scripts/admin-route-permission-audit.js --strict
          node scripts/ui-audit.js --strict
          node scripts/user-visible-copy-audit.js --strict
          git diff --check
      - name: Unit and integration tests
        run: |
          node scripts/org-session-test.js
          node scripts/context-route-guard-test.js
          node scripts/hr-profile-layout-test.js
          node scripts/api-cancellation-test.js
          node scripts/api-auth-recovery-test.js
          node scripts/admin-activity-org-switch-test.js
          node scripts/notification-org-switch-role-test.js
          node scripts/publication-summary-refresh-test.js
          node scripts/login-binding-refresh-test.js
          node scripts/login-auth-continuation-test.js
          node scripts/hr-profile-export-test.js
          node scripts/venue-rule-display-test.js
          node server/test/venueApprovalFlowRule.test.js
          node server/test/venueApprovalAuthorization.test.js
          node server/test/venueApprovalValidation.test.js
          node server/test/auditApprovalConditionSecurity.test.js
          node server/test/scoreRecordQuerySecurity.test.js
          node server/test/scoreCalculationIdentity.test.js
          node server/test/publicationOrgIsolation.test.js
          node server/test/tableFileAuthorization.test.js
          node server/test/tableFileExport.test.js
          node server/test/organizationDeletionSafety.test.js
          node server/test/organizationManagementIntegration.test.js
          node server/test/activateOrganization.test.js
          node server/test/scoringOrgCacheIsolation.test.js
          node server/test/historicalScoreResults.test.js
          node server/test/orgContextSecurity.test.js
          node server/test/adminAuthorization.test.js
          node server/test/adminPermissions.test.js
          node server/test/userBindingStatus.test.js
          node server/test/userBindingUnbind.test.js
          node server/test/adminPermissionMiddleware.test.js
          node server/test/adminPermissionsMigration.test.js
          node server/test/authChallenge.test.js
          node server/test/unifiedSessionPolicy.test.js
          node server/test/unifiedAuthContextToken.test.js
          node server/test/unifiedContextCatalog.test.js
          node server/test/loginBindingContract.test.js
          node server/test/requestDeduplication.test.js
          node server/test/clientVersion.test.js
          node server/test/runtimeHardening.test.js
          node server/test/publicMessage.test.js
          node server/test/securityMigration.test.js
          node server/test/dataIntegrityMigration.test.js
          node server/test/hrTableImport.test.js
          node server/test/hrProfileTemplateLibrary.test.js
          node server/test/hrProfileTemplateMigration.test.js
          node server/test/messageCenter.test.js
          node server/test/crossOrgMessageRoutes.test.js
          node server/test/notificationReliability.test.js
          node server/test/auditUploadMigration.test.js
          node server/test/deploymentAutomation.test.js
          node server/test/deploymentMigrationIntegration.test.js
          node server/test/unifiedIdentityMigration.test.js
          node server/test/venueFlowRestoreMigration.test.js
          node server/test/freshSchemaVenue.test.js
          bash -n server/scripts/deployProduction.sh
          bash -n server/scripts/deployEntrypoint.sh
          bash -n server/scripts/setupCollabSession.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'scripts/remote-collab.ps1')) | Out-Null"
      - name: Dependency audit
        working-directory: server
        run: npm audit

  deploy-production:
    name: deploy-production
    needs: audit-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: whusu-smart-workspace-production
      cancel-in-progress: false
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/whusu-smart-workspace-production"
          chmod 600 "$HOME/.ssh/whusu-smart-workspace-production"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact successful commit
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/whusu-smart-workspace-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$PROD_USER@$PROD_HOST" \
            "env WHUSU_SMART_WORKSPACE_DEPLOY_BRANCH=main timeout --signal=TERM --kill-after=10s 120s /home/ubuntu/whusu-smart-workspace-deploy/bin/deploy-entrypoint $TARGET_SHA"
