name: quality-gates

on:
  push:
    branches: [feature/audit, main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_remote:
        description: 强制远端完整验证
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validation-source:
    runs-on: ubuntu-latest
    outputs:
      local: ${{ steps.proof.outputs.local }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read signed local validation
        id: proof
        env:
          FORCE_REMOTE: ${{ inputs.force_remote }}
        run: |
          git fetch origin refs/notes/local-ci:refs/notes/local-ci || true
          node scripts/ci/proof.js

  audit-and-test:
    needs: validation-source
    if: needs.validation-source.outputs.local != 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECURITY_TEST_DB_HOST: 127.0.0.1
      SECURITY_TEST_DB_PORT: 3306
      HR_IMPORT_TEST_DB_HOST: 127.0.0.1
      HR_IMPORT_TEST_DB_PORT: 3306
      TEST_DB_USER_HOST: '%'
      DEPLOY_TEST_DB_HOST: 127.0.0.1
      DEPLOY_TEST_DB_PORT: 3306
      DEPLOY_TEST_DB_USER: root
      DEPLOY_TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        working-directory: server
        run: npm ci
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install browser for web tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Complete shared validation
        run: node scripts/ci/run.js

  validation-complete:
    name: validation-complete
    needs: [validation-source, audit-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful local or remote validation
        env:
          SOURCE_RESULT: ${{ needs.validation-source.result }}
          LOCAL_VALID: ${{ needs.validation-source.outputs.local }}
          REMOTE_RESULT: ${{ needs.audit-and-test.result }}
        run: |
          test "$SOURCE_RESULT" = success
          if [ "$LOCAL_VALID" = true ]; then
            test "$REMOTE_RESULT" = skipped
          else
            test "$REMOTE_RESULT" = success
          fi

  deploy-production:
    name: deploy-production
    needs: validation-complete
    if: always() && !cancelled() && needs.validation-complete.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: whusu-smart-workspace-production
      cancel-in-progress: false
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/whusu-smart-workspace-production"
          chmod 600 "$HOME/.ssh/whusu-smart-workspace-production"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact successful commit
        timeout-minutes: 45
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/whusu-smart-workspace-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$PROD_USER@$PROD_HOST" \
            "env WHUSU_SMART_WORKSPACE_DEPLOY_BRANCH=main /home/ubuntu/whusu-smart-workspace-deploy/bin/deploy-entrypoint $TARGET_SHA"
